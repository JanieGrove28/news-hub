<h1>{{ article.title }}</h1>

<p>{{ article.content }}</p>

<p><strong>Author:</strong> {{ article.author }}</p>

<p><strong>Publisher:</strong> {{ article.publisher }}</p>

<p><strong>Status:</strong> 
    {% if article.approved %}
        Approved
    {% else %}
        Pending
    {% endif %}
</p>

<hr>

<a href="{% url 'home' %}">Back</a>

{% if user == article.author or user.role == "editor" %}
    <a href="{% url 'edit_article' article.id %}">Edit</a>
    <a href="{% url 'delete_article' article.id %}">Delete</a>
{% endif %}

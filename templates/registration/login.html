{% extends 'base.html' %}

{% block content %}

<h2 class="page-title">Login</h2>

<div class="card">
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit" class="btn">Login</button>
    </form>


    <p style="margin-top: 15px;">
        Don't have an account?
        <a href="{% url 'register' %}" class="btn">Sign Up</a>
    </p>
</div>

{% endblock %}

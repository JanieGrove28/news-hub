<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News Hub</title>

    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>

<nav class="navbar">
    <div class="logo">
        📰 News Hub
    </div>

    <div class="nav-links">
        <a href="/">Home</a>

        {% if user.is_authenticated %}

            <a href="{% url 'create_article' %}">Create Article</a>

            <a href="{% url 'logout' %}">Logout</a>
        {% else %}

            <a href="/login/">Login</a>

        {% endif %}
    </div>
</nav>

<div class="container">
    {% block content %}
    {% endblock %}
</div>

</body>
</html>
